<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">HybridMount</title>
  <desc id="description">灰蓝色骡子从椭圆地洞探头，鼻子以下藏在洞内。</desc>

  <defs>
    <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C69A66"/>
      <stop offset="1" stop-color="#795036"/>
    </linearGradient>

    <radialGradient id="hole" cx=".5" cy=".35" r=".7">
      <stop offset="0" stop-color="#171515"/>
      <stop offset="1" stop-color="#493429"/>
    </radialGradient>

    <linearGradient id="coat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DCE5EE"/>
      <stop offset=".5" stop-color="#D7E0EA"/>
      <stop offset="1" stop-color="#BFCEDD"/>
    </linearGradient>

    <linearGradient id="earCoat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D7E0EA"/>
      <stop offset="1" stop-color="#B9C8DA"/>
    </linearGradient>

    <linearGradient id="muzzle" x1=".2" y1="0" x2=".7" y2="1">
      <stop offset="0" stop-color="#F8EDD9"/>
      <stop offset=".5" stop-color="#EFDDC0"/>
      <stop offset="1" stop-color="#D8C4A9"/>
    </linearGradient>

    <linearGradient id="eye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>

    <!-- 洞口以下的头部不显示 -->
    <clipPath id="aboveHole" clipPathUnits="userSpaceOnUse">
      <path d="M0 0 H512 V330 H445                A189 43 0 0 1 67 330                H0 Z"/>
    </clipPath>
  </defs>

  <g transform="translate(0 40)">
    <!-- 地洞与后缘 -->
    <ellipse cx="256" cy="354" rx="207" ry="51" fill="#221B17" opacity=".13"/>
    <ellipse cx="256" cy="330" rx="211" ry="64" fill="url(#soil)" stroke="#67462F" stroke-width="5"/>
    <ellipse cx="256" cy="330" rx="189" ry="43" fill="url(#hole)"/>
    <path d="M75 309 C142 268 365 268 437 309" fill="none" stroke="#E2BD87" stroke-width="7" stroke-linecap="round"/>

    <!-- 骡头：按洞口轮廓裁切 -->
    <g clip-path="url(#aboveHole)">
      <g stroke="#8297AC" stroke-width="5" stroke-linejoin="round">
        <path d="M233 220                  C207 173 151 108 95 53                  C169 58 242 114 265 185 Z" fill="url(#earCoat)"/>
        <path d="M235 197                  C204 146 152 101 120 72                  C184 90 231 137 249 187 Z" fill="#BE9F9A" stroke="none"/>

        <path d="M270 196                  C255 129 277 57 320 27                  C339 90 329 158 304 216 Z" fill="url(#earCoat)"/>
        <path d="M284 185                  C278 131 292 77 314 50                  C322 104 313 155 297 194 Z" fill="#BE9F9A" stroke="none"/>
      </g>

      <path d="M232 179                C259 157 305 164 326 199                C345 230 335 268 353 300                C378 342 366 396 329 428                C304 451 250 452 218 428                C183 402 172 349 184 294                C194 248 209 207 232 179 Z" fill="url(#coat)" stroke="#8297AC" stroke-width="5" stroke-linejoin="round"/>

      <!-- 鬃毛 -->
      <path d="M264 173                L276 151 L285 166 L300 150 L302 170                L319 163 L315 186                C301 176 282 173 264 183 Z" fill="#293F5C" stroke="#293F5C" stroke-width="3" stroke-linejoin="round"/>

      <path d="M339 244 C341 286 359 305 357 339" fill="none" stroke="#F8FAFC" stroke-width="8" stroke-linecap="round" opacity=".35"/>

      <!-- 白色额纹 -->
      <path d="M258 190                C264 183 274 184 279 192                L283 283 L254 283 Z" fill="#F8FAFC"/>

      <!-- 眼睛 -->
      <g stroke="#293F5C" stroke-width="7">
        <ellipse cx="240" cy="229" rx="27" ry="47" transform="rotate(9 240 229)" fill="url(#eye)"/>
        <ellipse cx="292" cy="225" rx="32" ry="52" transform="rotate(-6 292 225)" fill="url(#eye)"/>
      </g>

      <ellipse cx="242" cy="250" rx="10" ry="13" fill="#243A55"/>
      <ellipse cx="288" cy="249" rx="11" ry="14" fill="#243A55"/>
      <circle cx="245" cy="245" r="4" fill="#FFFFFF"/>
      <circle cx="291" cy="244" r="4.5" fill="#FFFFFF"/>

      <!-- 米色鼻部，下半部分藏入洞内 -->
      <path d="M177 255                C138 252 106 275 103 310                C100 332 115 351 121 370                C128 397 153 414 190 417                C235 423 290 403 321 374                C346 351 347 324 325 301                C293 270 232 252 177 255 Z" fill="url(#muzzle)" stroke="#B6A38D" stroke-width="5" stroke-linejoin="round"/>

      <path d="M120 292                C151 256 221 264 264 281                C216 275 164 281 133 306 Z" fill="#FFFFFF" opacity=".3"/>

      <!-- 鼻孔 -->
      <path d="M122 307                C131 300 145 314 148 329                C151 344 143 349 137 339                C132 330 130 318 122 307 Z" fill="#776E70"/>
      <path d="M218 337                C226 318 250 307 267 314                C274 317 271 321 264 324                C247 332 234 344 224 355                C216 362 211 352 218 337 Z" fill="#776E70"/>

    </g>

    <!-- 洞口前缘覆盖鼻子以下 -->
    <path d="M45 330              A211 64 0 0 0 467 330              L445 330              A189 43 0 0 1 67 330 Z" fill="url(#soil)" stroke="#67462F" stroke-width="5" stroke-linejoin="round"/>

    <path d="M69 336 C128 383 385 383 443 336" fill="none" stroke="#DFB77E" stroke-width="6" stroke-linecap="round"/>

    <g fill="#67462F" opacity=".55">
      <ellipse cx="134" cy="372" rx="9" ry="3" transform="rotate(12 134 372)"/>
      <ellipse cx="216" cy="385" rx="6" ry="2.5"/>
      <ellipse cx="326" cy="382" rx="8" ry="3" transform="rotate(-8 326 382)"/>
      <ellipse cx="394" cy="367" rx="5" ry="2.5" transform="rotate(-18 394 367)"/>
    </g>
  </g>
</svg>
